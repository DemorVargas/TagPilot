# =============================================================================
# Treblo Tag Explorer - Docker Compose (all modes)
#
#   docker compose up -d                    -> ONLINE keyless (no API key, ever)
#   docker compose --profile local up -d    -> + local Ollama (fully offline AI)
#   docker compose --profile byok up -d     -> + your own API key
#   MODE=offline docker compose up -d       -> no AI, zero network calls
#
# Security defaults applied here:
#   - published on 127.0.0.1 only, so it is not reachable from the LAN
#   - read-only root filesystem, all capabilities dropped, no privilege escalation
#   - /tmp mounted as a small tmpfs (the app needs no writable disk)
#   - memory capped so a runaway request cannot eat the host
#   - container named explicitly for easy `docker logs`
#
# To expose it on your LAN deliberately, change the port mapping to "8000:8000"
# AND set AUTH_TOKEN. Do not do one without the other.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # The app. Default provider is keyless: no key, no account, no signup.
  # ---------------------------------------------------------------------------
  tag-explorer:
    build: .
    image: treblo-tag-explorer:latest
    container_name: treblo-tag-explorer
    restart: unless-stopped

    # BIND_ADDR defaults to 127.0.0.1, so only this machine can reach it.
    # Set BIND_ADDR=0.0.0.0 in .env to share it, and set AUTH_TOKEN with it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8000}:8000"

    env_file:
      - path: .env
        required: false

    environment:
      PORT: "8000"
      HOST: "0.0.0.0"          # inside the container; the port mapping restricts it
      MODE: "${MODE:-hybrid}"  # online | offline | hybrid

      TAG_FILE: /app/data/treblo_tags_v3.txt

      # --- authentication ---
      # Generate one with:  python3 app/cli.py --token
      # Required whenever the port is exposed beyond loopback.
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-0}"

      # --- AI ---
      AI_ENABLED: "${AI_ENABLED:-1}"
      AI_PROVIDER: "${AI_PROVIDER:-keyless}"
      KEYLESS_MODEL: "${KEYLESS_MODEL:-openai-fast}"
      AI_TIMEOUT: "${AI_TIMEOUT:-45}"
      AI_CACHE_TTL: "${AI_CACHE_TTL:-900}"
      CIRCUIT_FAIL_THRESHOLD: "${CIRCUIT_FAIL_THRESHOLD:-3}"
      # Only used when AI_PROVIDER=compat
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-llama3.2}"

      # --- limits ---
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-60}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-15}"
      AI_RATE_LIMIT_PER_MIN: "${AI_RATE_LIMIT_PER_MIN:-12}"
      MAX_THREADS: "${MAX_THREADS:-24}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-65536}"
      MAX_QUERY_CHARS: "${MAX_QUERY_CHARS:-500}"

      # Set to 1 only if you run behind a reverse proxy you control.
      TRUST_PROXY: "${TRUST_PROXY:-0}"

      # --- names this instance is reached by ---
      # Inside a container the app cannot see the host's LAN IP, so if you
      # expose the port beyond loopback you MUST list the name clients use, or
      # requests will be refused as a foreign origin. Comma separated.
      #   ALLOWED_HOSTS=192.168.1.50,mybox.local,tags.example.com
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      # Full origins, for a browser on a different host than the server.
      #   ALLOWED_ORIGINS=https://tags.example.com
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"

    # Lets the container reach an Ollama/LM Studio running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- container hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE      # only needed if you change PORT below 1024
    ipc: private

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # PROFILE: local  --  fully offline AI. No cloud, no key, no data leaving
  # the box. Enable with:  docker compose --profile local up -d
  # Then in the UI pick provider "own key / local" and model llama3.2:1b
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: treblo-ollama
    profiles: ["local"]
    restart: unless-stopped
    # Not published to the host: only the app container needs to reach it.
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3G

  # Pulls a small model once so the local profile is usable immediately.
  # Small on purpose: this is a tag picker, not a chatbot. 1B is plenty.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: treblo-ollama-pull
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "waiting for ollama...";
        for i in $$(seq 1 60); do
          if ollama list >/dev/null 2>&1; then break; fi; sleep 2;
        done
        echo "pulling ${LOCAL_MODEL:-llama3.2:1b} (one time, ~1.3GB)...";
        ollama pull ${LOCAL_MODEL:-llama3.2:1b};
        echo "done. In the UI pick provider 'own key / local' and model ${LOCAL_MODEL:-llama3.2:1b}";
    restart: "no"

volumes:
  ollama-models:
