# =============================================================================
# Treblo Tag Explorer -- keyless install
#
#   ./install.sh --keyless          (recommended: handles everything)
#   docker compose -f docker-compose.keyless.yml up -d
#   then open http://localhost:8000
#
# No API key. No signup. No account. No billing. Nothing to configure.
# The AI assist checkbox works against a free public keyless endpoint, and if
# that endpoint is ever down the app still works, because the offline engine
# does all the real filtering.
#
# Everything is driven by .env, which install.sh writes. The defaults below
# apply if you run compose without it.
#
# Hardening: bound to 127.0.0.1, read-only root filesystem, all capabilities
# dropped, memory capped. Safe to leave running.
# =============================================================================

services:
  tag-explorer:
    build: .
    image: treblo-tag-explorer:latest
    container_name: treblo-tag-explorer
    restart: unless-stopped

    # BIND_ADDR defaults to 127.0.0.1, so only this machine can reach it.
    # Set BIND_ADDR=0.0.0.0 in .env to share it, and set AUTH_TOKEN with it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8000}:8000"

    env_file:
      - path: .env
        required: false

    environment:
      MODE: "${MODE:-hybrid}"
      AI_ENABLED: "${AI_ENABLED:-1}"
      AI_PROVIDER: "${AI_PROVIDER:-keyless}"
      KEYLESS_MODEL: "${KEYLESS_MODEL:-openai-fast}"
      TAG_FILE: "/app/data/treblo_tags_v3.txt"

      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-0}"

      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-60}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-15}"
      AI_RATE_LIMIT_PER_MIN: "${AI_RATE_LIMIT_PER_MIN:-12}"
      MAX_THREADS: "${MAX_THREADS:-24}"

      # --- names this instance is reached by ---
      # Loopback works automatically. If you expose the port beyond 127.0.0.1
      # you MUST list the name clients use, because inside a container the app
      # cannot see your LAN IP and would refuse the request as a foreign
      # origin. Comma separated:
      #   ALLOWED_HOSTS=192.168.1.50,mybox.local,tags.example.com
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      # Full origins, if a browser on another host loads the UI from a
      # different address:  ALLOWED_ORIGINS=https://tags.example.com
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"

      # Set to 1 only if you run behind a reverse proxy you control.
      TRUST_PROXY: "${TRUST_PROXY:-0}"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ipc: private

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
